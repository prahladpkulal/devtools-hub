<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Base64 Encoder Decoder | DevTools Hub</title><meta name="description" content="Encode and decode Base64 text in your browser."><link rel="stylesheet" href="/assets/style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="/">DevTools<span>Hub</span></a><nav><a href="/">All Tools</a><a href="/privacy.html">Privacy</a></nav></div></header><main class="container tool-page"><section class="tool-hero"><p class="eyebrow">DEVTOOLS HUB</p><h1>Base64 Encoder / Decoder</h1><p>Encode plain text to Base64 or decode Base64 back to text.</p></section><div class="tool-box"><textarea id="input" placeholder="Enter text..."></textarea><div class="actions"><button class="btn" onclick="enc()">Encode</button><button class="btn" onclick="dec()">Decode</button><button class="btn alt" onclick="document.getElementById('input').value=''">Clear</button></div><div id="result" class="result"></div></div><section class="seo-copy"><h2>About this tool</h2><p>Base64 is an encoding format, not encryption. Do not treat Base64 output as confidential.</p></section></main><footer><div class="container copyright">© 2026 DevTools Hub</div></footer><script>function enc(){try{document.getElementById('result').textContent=btoa(unescape(encodeURIComponent(document.getElementById('input').value)))}catch(e){document.getElementById('result').textContent=e.message}}function dec(){try{document.getElementById('result').textContent=decodeURIComponent(escape(atob(document.getElementById('input').value.trim())))}catch(e){document.getElementById('result').textContent='Invalid Base64'}}</script></body></html>
