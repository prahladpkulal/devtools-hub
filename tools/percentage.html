<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Percentage Calculator | DevTools Hub</title><meta name="description" content="Calculate percentages and percentage changes."><link rel="stylesheet" href="/assets/style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="/">DevTools<span>Hub</span></a><nav><a href="/">All Tools</a><a href="/privacy.html">Privacy</a></nav></div></header><main class="container tool-page"><section class="tool-hero"><p class="eyebrow">DEVTOOLS HUB</p><h1>Percentage Calculator</h1><p>Calculate X% of a number and percentage change between two values.</p></section><div class="tool-box"><div class="row"><div><label>Percentage (%)</label><input id="p" class="tool-input" type="number" placeholder="10"></div><div><label>Number</label><input id="n" class="tool-input" type="number" placeholder="500"></div></div><div class="actions"><button class="btn" onclick="part()">Calculate X% of number</button></div><div id="result" class="result"></div><hr><div class="row"><div><label>Old value</label><input id="oldv" class="tool-input" type="number"></div><div><label>New value</label><input id="newv" class="tool-input" type="number"></div></div><div class="actions"><button class="btn" onclick="change()">Calculate change</button></div></div><section class="seo-copy"><h2>About this tool</h2><p>Useful for everyday percentage calculations, including increases and decreases.</p></section></main><footer><div class="container copyright">© 2026 DevTools Hub</div></footer><script>function part(){result.textContent=(Number(p.value)/100*Number(n.value)).toFixed(4)}function change(){const a=Number(oldv.value),b=Number(newv.value);result.textContent=a===0?'Old value cannot be zero':((b-a)/a*100).toFixed(2)+'%'}</script></body></html>
