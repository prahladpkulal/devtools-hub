<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salary Hike Calculator | DevTools Hub</title><meta name="description" content="Calculate salary increment percentage and new CTC."><link rel="stylesheet" href="/assets/style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="/">DevTools<span>Hub</span></a><nav><a href="/">All Tools</a><a href="/privacy.html">Privacy</a></nav></div></header><main class="container tool-page"><section class="tool-hero"><p class="eyebrow">DEVTOOLS HUB</p><h1>Salary Hike Calculator</h1><p>Enter your old and new annual CTC to calculate the raise.</p></section><div class="tool-box"><div class="row"><div><label>Old CTC (₹ LPA)</label><input id="old" class="tool-input" type="number" step="0.01" placeholder="32"></div><div><label>New CTC (₹ LPA)</label><input id="new" class="tool-input" type="number" step="0.01" placeholder="33.5"></div></div><div class="actions"><button class="btn" onclick="calc()">Calculate</button></div><div id="result" class="result"></div></div><section class="seo-copy"><h2>About this tool</h2><p>Calculates the mathematical increase in annual CTC. Actual take-home pay depends on salary structure, tax, PF and other components.</p></section></main><footer><div class="container copyright">© 2026 DevTools Hub</div></footer><script>function calc(){const a=Number(document.getElementById('old').value),b=Number(document.getElementById('new').value);if(!(a>0)||!(b>=0)){document.getElementById('result').textContent='Enter valid values';return}const diff=b-a,p=diff/a*100;document.getElementById('result').textContent=`Increase: ₹${diff.toFixed(2)} LPA\nHike: ${p.toFixed(2)}%\nMonthly CTC difference: ₹${(diff*100000/12).toFixed(0)}`}</script></body></html>
