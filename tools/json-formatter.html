<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON Formatter | DevTools Hub</title><meta name="description" content="Format, validate and minify JSON in your browser."><link rel="stylesheet" href="/assets/style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="/">DevTools<span>Hub</span></a><nav><a href="/">All Tools</a><a href="/privacy.html">Privacy</a></nav></div></header><main class="container tool-page"><section class="tool-hero"><p class="eyebrow">DEVTOOLS HUB</p><h1>JSON Formatter & Validator</h1><p>Paste JSON, validate it, pretty-print it or minify it.</p></section><div class="tool-box"><textarea id="input" placeholder='{"hello":"world"}'></textarea><div class="actions"><button class="btn" onclick="formatJson()">Format</button><button class="btn alt" onclick="minifyJson()">Minify</button><button class="btn alt" onclick="document.getElementById('input').value=''">Clear</button></div><div id="result" class="result"></div></div><section class="seo-copy"><h2>About this tool</h2><p>Useful for API responses, configuration files and debugging. Processing happens in your browser.</p></section></main><footer><div class="container copyright">© 2026 DevTools Hub</div></footer><script>const el=document.getElementById('input'),r=document.getElementById('result');function formatJson(){try{el.value=JSON.stringify(JSON.parse(el.value),null,2);r.textContent='Valid JSON ✓'}catch(e){r.textContent='Invalid JSON: '+e.message}}function minifyJson(){try{el.value=JSON.stringify(JSON.parse(el.value));r.textContent='Minified successfully ✓'}catch(e){r.textContent='Invalid JSON: '+e.message}}</script></body></html>
