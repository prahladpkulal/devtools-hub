<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XML Formatter | DevTools Hub</title><meta name="description" content="Pretty-print and validate XML in your browser."><link rel="stylesheet" href="/assets/style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="/">DevTools<span>Hub</span></a><nav><a href="/">All Tools</a><a href="/privacy.html">Privacy</a></nav></div></header><main class="container tool-page"><section class="tool-hero"><p class="eyebrow">DEVTOOLS HUB</p><h1>XML Formatter</h1><p>Paste XML and format it for easier reading.</p></section><div class="tool-box"><textarea id="input" placeholder="<root><item>Hello</item></root>"></textarea><div class="actions"><button class="btn" onclick="formatXml()">Format XML</button><button class="btn alt" onclick="document.getElementById('input').value=''">Clear</button></div><div id="result" class="result"></div></div><section class="seo-copy"><h2>About this tool</h2><p>Useful for SOAP payloads, XML configuration and API troubleshooting. Processing is local to your browser.</p></section></main><footer><div class="container copyright">© 2026 DevTools Hub</div></footer><script>function formatXml(){const s=document.getElementById('input').value.trim(),r=document.getElementById('result');try{const xml=new DOMParser().parseFromString(s,'application/xml');if(xml.querySelector('parsererror'))throw Error('Invalid XML');let text=new XMLSerializer().serializeToString(xml).replace(/></g,'>\n<');let pad=0;text=text.split('\n').map(x=>{let line=x.trim();if(/^<\//.test(line))pad=Math.max(0,pad-2);const out=' '.repeat(pad)+line;if(/^<[^!?/][^>]*[^/]>(?!.*<\/)/.test(line))pad+=2;return out}).join('\n');document.getElementById('input').value=text;r.textContent='Valid XML ✓'}catch(e){r.textContent=e.message}}</script></body></html>
