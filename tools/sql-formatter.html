<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SQL Formatter | DevTools Hub</title><meta name="description" content="Format SQL for readability in your browser."><link rel="stylesheet" href="/assets/style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="/">DevTools<span>Hub</span></a><nav><a href="/">All Tools</a><a href="/privacy.html">Privacy</a></nav></div></header><main class="container tool-page"><section class="tool-hero"><p class="eyebrow">DEVTOOLS HUB</p><h1>SQL Formatter</h1><p>A lightweight formatter for common SQL statements.</p></section><div class="tool-box"><textarea id="input" placeholder="select id,name from users where status='ACTIVE' order by name;"></textarea><div class="actions"><button class="btn" onclick="fmt()">Format SQL</button><button class="btn alt" onclick="copyOut()">Copy</button></div><div id="result" class="result"></div></div><section class="seo-copy"><h2>About this tool</h2><p>This is intentionally lightweight rather than a full SQL parser. For complex vendor-specific SQL, verify the output before using it.</p></section></main><footer><div class="container copyright">© 2026 DevTools Hub</div></footer><script>function fmt(){let s=document.getElementById('input').value.trim();s=s.replace(/\s+/g,' ');s=s.replace(/\b(FROM|WHERE|GROUP BY|ORDER BY|HAVING|LIMIT|LEFT JOIN|RIGHT JOIN|INNER JOIN|OUTER JOIN|JOIN|UNION|SET|VALUES)\b/gi,'\n$1');document.getElementById('result').textContent=s.replace(/^\n/,'')}async function copyOut(){await navigator.clipboard.writeText(document.getElementById('result').textContent)}</script></body></html>
