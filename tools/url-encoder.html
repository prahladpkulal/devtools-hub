<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URL Encoder Decoder | DevTools Hub</title><meta name="description" content="Encode and decode URL components in your browser."><link rel="stylesheet" href="/assets/style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="/">DevTools<span>Hub</span></a><nav><a href="/">All Tools</a><a href="/privacy.html">Privacy</a></nav></div></header><main class="container tool-page"><section class="tool-hero"><p class="eyebrow">DEVTOOLS HUB</p><h1>URL Encoder / Decoder</h1><p>Safely encode URL parameters or decode percent-encoded text.</p></section><div class="tool-box"><textarea id="input" placeholder="hello world?name=John Doe"></textarea><div class="actions"><button class="btn" onclick="enc()">Encode</button><button class="btn" onclick="dec()">Decode</button></div><div id="result" class="result"></div></div><section class="seo-copy"><h2>About this tool</h2><p>Use this for query-string values and other URL components. It uses the browser's standard URI encoding functions.</p></section></main><footer><div class="container copyright">© 2026 DevTools Hub</div></footer><script>const i=document.getElementById('input'),r=document.getElementById('result');function enc(){try{r.textContent=encodeURIComponent(i.value)}catch(e){r.textContent=e.message}}function dec(){try{r.textContent=decodeURIComponent(i.value)}catch(e){r.textContent='Invalid encoded text'}}</script></body></html>
